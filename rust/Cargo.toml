[package]
name = "rust_lib_reader_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
anyhow = "1.0.100"
hotpath = "0.9.2"
lru = "0.13"
serde_json = "1.0"

# File scanning
walkdir = "2.5.0"

# PDF rendering - enabling thread_safe and sync for OnceLock usage
pdfium-render = { version = "0.8.37", features = ["thread_safe", "sync"] }

# DOCX parsing
docx-rs = "0.4"

# Image processing (for PDF to PNG conversion)
image = "0.25.9"

# Archive extraction (for EPUB/CBZ covers and CBR/RAR archives)
zip = "2.2"
unrar-rs = "0.15"

# MOBI/AZW3 parsing
mobi = "0.8"

# TTS text highlighting
scraper = "0.22"
unicode-segmentation = "1.12"
regex = "1.11"
roxmltree = "0.21.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
panic = "unwind"
strip = true

# Guarantee correct AArch64 loop & NEON SIMD codegen for RAR + JPEG IDCT
[profile.release.package.unrar-rs]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.jpeg-decoder]
opt-level = 3

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
