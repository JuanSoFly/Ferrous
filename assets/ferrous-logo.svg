      <stop offset="100%" stop-color="#DE9F78"/>
    </linearGradient>
    <filter id="shadow_s3" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
