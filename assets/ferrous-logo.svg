    <path d="M 4 28 C 4 14.7, 14.7 4, 28 4 L 70 4 C 83.3 4, 94 14.7, 94 28 L 94 308 C 94 321.3, 83.3 332, 70 332 L 28 332 C 14.7 332, 4 321.3, 4 308 Z" fill="url(#stemGrad_s3)"/>
