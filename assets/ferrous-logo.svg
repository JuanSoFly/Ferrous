<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 248 368" width="100%" height="100%" role="img" aria-label="Ferrous Reader - Iron Folio F Dynamic Curl">
  <defs>
    <linearGradient id="stemGrad_s3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA2921"/>
      <stop offset="50%" stop-color="#8C1D18"/>
      <stop offset="100%" stop-color="#4F0F0C"/>
    </linearGradient>
    <linearGradient id="topFolioGrad_s3" x1="0%" y1="0%" x2="100%" y2="50%">
