name: Build and Release APKs

on:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.44.0'
  SCCACHE_GHA_ENABLED: 'true'
  RUSTC_WRAPPER: 'sccache'

jobs:
  lint:
    name: Lint Rust & Flutter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # ===== sccache Setup (Rust Compilation Cache) =====
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Lint Rust with Clippy
        working-directory: rust
        run: cargo clippy -- -D warnings

  build-android:
    needs: lint
    name: Build Android APKs
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for creating releases
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      # ===== Rust Setup =====
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # ===== sccache Setup (Rust Compilation Cache) =====
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Install cargo-ndk
        uses: taiki-e/cache-cargo-install-action@v3
        with:
          tool: cargo-ndk

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ===== Java Setup =====
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ===== Flutter Setup =====
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      # ===== Android NDK Setup =====
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Set NDK environment variables
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      # ===== Make cargokit scripts executable =====
      - name: Make cargokit scripts executable
        run: |
          chmod +x rust_builder/cargokit/*.sh
          chmod +x rust_builder/cargokit/build_tool/lib/*.dart || true

      # ===== Cache Gradle =====
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ===== Install PDFium binaries =====
      - name: Install PDFium Android binaries
        run: |
          chmod +x scripts/setup-pdfium-android.sh
          PDFIUM_ABIS="arm64-v8a,armeabi-v7a,x86_64" bash scripts/setup-pdfium-android.sh

      # ===== Build APKs =====
      # Note: Cargokit (flutter_rust_bridge) handles Rust compilation automatically
      - name: Build APKs (split per ABI)
        run: flutter build apk --split-per-abi --release

      - name: Show sccache stats
        run: sccache --show-stats

      # ===== Rename APKs for clarity =====
      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          mv app-armeabi-v7a-release.apk ferrous-v${{ steps.version.outputs.VERSION }}-armeabi-v7a.apk
          mv app-arm64-v8a-release.apk ferrous-v${{ steps.version.outputs.VERSION }}-arm64-v8a.apk
          mv app-x86_64-release.apk ferrous-v${{ steps.version.outputs.VERSION }}-x86_64.apk

      # ===== Prepare Release Notes from CHANGELOG and Download Guide =====
      - name: Prepare Release Notes
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          REPO="${{ github.repository }}"

          cat << 'EOF' > /tmp/release_notes.md
          ### Which APK should I install?

          | File | Architecture | Target Devices | Notes |
          | :--- | :--- | :--- | :--- |
          EOF

          echo "| [**ferrous-v${VERSION}-arm64-v8a.apk**](https://github.com/${REPO}/releases/download/v${VERSION}/ferrous-v${VERSION}-arm64-v8a.apk) | arm64-v8a | Modern phones and tablets | Recommended (most devices) |" >> /tmp/release_notes.md
          echo "| [**ferrous-v${VERSION}-armeabi-v7a.apk**](https://github.com/${REPO}/releases/download/v${VERSION}/ferrous-v${VERSION}-armeabi-v7a.apk) | armeabi-v7a | Older 32-bit Android phones | Devices from 2016 or earlier / 32-bit |" >> /tmp/release_notes.md
          echo "| [**ferrous-v${VERSION}-x86_64.apk**](https://github.com/${REPO}/releases/download/v${VERSION}/ferrous-v${VERSION}-x86_64.apk) | x86_64 | Emulators and ChromeOS | PC emulators (BlueStacks, LDPlayer) |" >> /tmp/release_notes.md

          cat << 'EOF' >> /tmp/release_notes.md

          > **Note:** If you are unsure which build your device requires, choose **arm64-v8a**.

          ---

          ### Changelog

          EOF

          # Extract content between this version header and the next version header (or end)
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ { 
              if (found) exit
              if (index($0, ver)) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)
          
          # If no notes found, use a default message
          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION"
          fi
          
          # Append notes to release notes file
          echo "$NOTES" >> /tmp/release_notes.md

      # ===== Create GitHub Release =====
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Ferrous v${{ steps.version.outputs.VERSION }}
          body_path: /tmp/release_notes.md
          files: |
            build/app/outputs/flutter-apk/ferrous-v${{ steps.version.outputs.VERSION }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/ferrous-v${{ steps.version.outputs.VERSION }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/ferrous-v${{ steps.version.outputs.VERSION }}-x86_64.apk
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

